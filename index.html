<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Calculator</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
</head>
<body>

    <main class="calculator">

        <section class="display">
            <div id="expression" class="expression"></div>
            <div id="result" class="result">0</div>
        </section>

        <section class="keypad">

            <button class="key function" data-action="clear">AC</button>
            <button class="key function" data-action="delete" aria-label="Delete">⌫</button>
            <button class="key function" data-value="%">%</button>
            <button class="key operator" data-value="/">÷</button>

            <button class="key" data-value="7">7</button>
            <button class="key" data-value="8">8</button>
            <button class="key" data-value="9">9</button>
            <button class="key operator" data-value="*">×</button>

            <button class="key" data-value="4">4</button>
            <button class="key" data-value="5">5</button>
            <button class="key" data-value="6">6</button>
            <button class="key operator" data-value="-">−</button>

            <button class="key" data-value="1">1</button>
            <button class="key" data-value="2">2</button>
            <button class="key" data-value="3">3</button>
            <button class="key operator" data-value="+">+</button>

            <button class="key function" data-action="sign">+/−</button>
            <button class="key" data-value="0">0</button>
            <button class="key" data-value=".">.</button>
            <button class="key equal" data-action="calculate">=</button>

        </section>

        <div id="status" class="status" role="status"></div>

    </main>

    <script type="module" src="./js/app.js"></script>
    <script>
        if ("serviceWorker" in navigator) 
        {
            window.addEventListener("load", 
            
        () => {
    
        navigator.serviceWorker.register("./service-worker.js");});
        }
    </script>

</body>
</html>
